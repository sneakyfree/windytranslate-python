name: Release to PyPI

# Publishes windytranslate to PyPI on tag push (e.g. v0.1.0), with PyPI
# Trusted Publishing (OIDC): no API token is stored anywhere.
#
# One-time PyPI setup (done by the account owner):
#   https://pypi.org/manage/account/publishing/ -> Add a new pending publisher -> GitHub
#     PyPI project name: windytranslate
#     owner:             sneakyfree
#     repository:        windytranslate-python
#     workflow:          release.yml
#     environment:       pypi
#
# To cut a release: bump `version` in pyproject.toml and src/windytranslate/__init__.py,
# then `git tag v<version> && git push origin v<version>`.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    # Self-hosted: GitHub-hosted runners are unavailable on this account.
    runs-on: [self-hosted, linux, x64]
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q uv==0.12.5
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          verbose: true
